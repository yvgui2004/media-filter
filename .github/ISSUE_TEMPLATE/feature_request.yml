name: Feature request
description: Suggest a capability, integration, or workflow improvement.
title: "[Feature]: "
labels: ["enhancement"]
body:
  - type: markdown
    attributes:
      value: |
        Tell us about the workflow, not just the button. "I have 4 TB of footage
        and need to find every clip with a person and a screen" is more useful
        than "add a filter".
  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do?
      description: Describe the real task and where the current version gets in the way.
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: What would help?
      description: Your ideal solution, or the closest workaround you use today.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Scanning / metadata
        - AI tagging (local)
        - AI tagging (cloud / hybrid)
        - Filtering / sorting / search
        - Batch FFmpeg / conversion
        - Export / integrations
        - UI / themes / language
        - Packaging / install
        - Other
    validations:
      required: true
  - type: checkboxes
    id: privacy
    attributes:
      label: Privacy
      options:
        - label: This feature can work without uploading files by default.
          required: false