[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediafilter"
version = "0.1.1"
description = "Desktop media browser: scan, tag with local or cloud AI, and generate batch FFmpeg commands."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8", "pyright>=1.1.380"]
ai = [
    "numpy>=1.24",
    "onnxruntime-directml>=1.17; sys_platform == 'win32'",
    "onnxruntime>=1.17; sys_platform != 'win32'",
]

[project.scripts]
mediafilter = "mediafilter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediafilter = ["i18n/locales/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]