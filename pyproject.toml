[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mediafilter"
version = "0.1.0"
description = "Cross-platform desktop GUI for scanning media folders and generating FFmpeg batch commands."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "PySide6>=6.6",
    "platformdirs>=4.0",
    "send2trash>=1.8",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.scripts]
mediafilter = "mediafilter.__main__:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
mediafilter = ["i18n/locales/*.json", "assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]